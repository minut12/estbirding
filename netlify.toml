[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # The eBird token is a client-side key by design: the map iframes call
  # api.ebird.org directly from the browser, so it is embedded in
  # public/maps/*/index.html and map-placeholder.html. Netlify's secrets scan
  # flags it and fails the build; this omits that one key from the scan.
  SECRETS_SCAN_OMIT_KEYS = "EBIRD_API_TOKEN"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits content-hashed filenames under /assets (index-<hash>.js/css), so a
# changed file always has a new URL — safe to cache immutably.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The map HTMLs are NOT content-hashed (stable paths like /maps/linnuliigid/
# index.html) and the service worker already serves them network-first, so they
# must revalidate on every load or a deploy would not reach existing users.
[[headers]]
  for = "/maps/*"
  [headers.values]
    Cache-Control = "no-cache"

# The SPA entry point is rewritten by the redirect above and references the
# hashed asset URLs; caching it would pin users to an old asset manifest.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
